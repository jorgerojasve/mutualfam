// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${findProperty('android.kotlinVersion') ?: '2.2.0'}")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Disable codegen schema generation for react-native-screens.
// react-native-screens@4.26.0 uses CT.WithDefault<boolean, true> TypeScript syntax
// that is incompatible with @react-native/codegen@0.86.3's parser.
// Since newArchEnabled=false, these codegen artifacts are not needed.
subprojects { subproject ->
  subproject.afterEvaluate {
    if (subproject.tasks.findByName("generateCodegenSchemaFromJavaScript") &&
        subproject.name == "react-native-screens") {
      subproject.tasks.named("generateCodegenSchemaFromJavaScript").configure {
        enabled = false
      }
    }
  }
}
