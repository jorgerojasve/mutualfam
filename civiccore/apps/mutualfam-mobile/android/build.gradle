// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${findProperty('android.kotlinVersion') ?: '2.2.0'}")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  configurations.all {
    resolutionStrategy {
      // Downgrade to avoid AGP 8.9.1 / compileSdk 36 requirements from newer androidx libs
      force 'androidx.core:core:1.15.0'
      force 'androidx.core:core-ktx:1.15.0'
      force 'androidx.activity:activity:1.9.3'
      force 'androidx.activity:activity-ktx:1.9.3'
    }
  }

  // The TypeScript issues in react-native-screens are fixed by patch-react-native-screens.sh.
  // We do not need to disable codegen; it will run successfully and produce necessary artifacts.
}

// ---------------------------------------------------------------------------
// Exclude react-native-screens "gamma" source files from compilation.
//
// The "gamma" feature in react-native-screens 4.26+ uses React Native 0.80+
// internal APIs that do not exist in React Native 0.79.2 (used by Expo SDK 57):
//   - UIManagerHelper.getUIManager(ReactContext, UIManagerType)
//   - JSTouchDispatcher.onChildStartedNativeGesture(MotionEvent, EventDispatcher, ReactContext)
//   - UIManagerHelper.getEventDispatcher(ReactContext, UIManagerType)
//
// Since rnsGammaEnabled=false is set in gradle.properties, these code paths
// are never executed at runtime — but Kotlin still compiles them, causing build
// failures. This block excludes the entire gamma directory from compilation.
// ---------------------------------------------------------------------------
subprojects { proj ->
  if (proj.name == 'react-native-screens') {
    proj.afterEvaluate {
      android.sourceSets.main {
        kotlin.exclude '**/gamma/**'
        java.exclude '**/gamma/**'
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
