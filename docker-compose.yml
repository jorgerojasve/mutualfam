# MutualSol - docker-compose para desarrollo local
# Levanta PostgreSQL y la API en un solo comando: docker-compose up
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: mutualsol_db
    environment:
      POSTGRES_USER: mutualsol
      POSTGRES_PASSWORD: mutualsol_pass
      POSTGRES_DB: mutualsol_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build: ./backend
    container_name: mutualsol_api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://mutualsol:mutualsol_pass@db:5432/mutualsol_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
