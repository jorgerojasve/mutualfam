# MutualSol - docker-compose para desarrollo local
# Levanta PostgreSQL y la API en un solo comando: docker-compose up
version: '3.9'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-mutualfam}_api
    environment:
      DATABASE_URL: sqlite:////app/data/${APP_NAME:-mutualfam}.db
      PORT: 8080
    ports:
      - "8000:8080"
    volumes:
      - ./civiccore/apps/${APP_NAME:-mutualfam}:/app
      - ./civiccore/backend:/civiccore_backend
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app --reload-dir /civiccore_backend
