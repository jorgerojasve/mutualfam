name: Lanzamiento Automático (Release) de la APK

on:
  push:
    tags:
      - 'v*' # Solo se ejecuta cuando subes un tag como v1.0.0, v2.1.3, etc.

jobs:
  build-apk:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Descargar Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: civiccore/package-lock.json

      - name: ☕ Configurar Java JDK (Para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Instalar Dependencias (Monorepo)
        working-directory: civiccore
        run: |
          npm ci
          # Limpiar copias anidadas conflictivas que rompen la compilación de RN 0.86.3
          rm -rf apps/mutualfam-mobile/node_modules/react-native
          rm -rf apps/mutualfam-mobile/node_modules/react-native-safe-area-context

      - name: 📱 Compilar APK
        working-directory: civiccore/apps/mutualfam-mobile
        # Ejecuta el mismo script que usas en tu máquina local
        run: npm run build:apk
        env:
          # Si tienes variables de entorno necesarias para la compilación, ponlas aquí:
          EXPO_PUBLIC_API_URL: "https://mutualfam-backend.fly.dev"

      - name: 🚀 Crear GitHub Release y Subir APK
        uses: softprops/action-gh-release@v2
        with:
          files: civiccore/apps/mutualfam-mobile/mutualfam-qa-*.apk
          name: Versión ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
