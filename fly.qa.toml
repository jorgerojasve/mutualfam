# fly.qa.toml app configuration file for mutualfam-qa-backend (Entorno QA)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mutualfam-qa-backend'
# Trigger QA deployment
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CIVICCORE_ENV = 'sandbox'
  DATABASE_URL = 'sqlite:////app/data/mutualfam.db'
  PORT = '8080'
  LIMIT_MAX_MEMBERS_PER_MUTUAL = '5'
  LIMIT_EXTRA_MUTUALS_FIRST_MUTUAL = '1'
  LIMIT_CONTACT_EMAIL = 'mutualfam@gmail.com'

[[mounts]]
  source = 'mutualfam_qa_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
